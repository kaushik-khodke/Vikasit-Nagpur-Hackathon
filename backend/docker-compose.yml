version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: tigertrace/postgres-postgis-pgvector:16-3.4
    container_name: tigertrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tigertrace
      POSTGRES_USER: tigertrace
      POSTGRES_PASSWORD: tigertrace_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tigertrace -d tigertrace"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tigertrace_net

  adminer:
    image: adminer:latest
    container_name: tigertrace_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: hydra
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tigertrace_net

volumes:
  pgdata:
    driver: local

networks:
  tigertrace_net:
    driver: bridge
